<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology — Chromosomes and DNA MCQ Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #f3f6f4;
    --panel: #ffffff;
    --ink: #16302b;
    --ink-soft: #4d635d;
    --line: #d9e3df;
    --teal: #1f6f5c;
    --teal-dark: #154d40;
    --amber: #c1852b;
    --amber-soft: #f4e3c8;
    --red: #b3452f;
    --red-soft: #fbe6e0;
    --green: #1f6f5c;
    --green-soft: #e2efe9;
    --grey-soft: #eef1ef;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family: Georgia, "Times New Roman", serif;
    font-weight:600;
    margin:0 0 .3em 0;
    color:var(--teal-dark);
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 18px 80px 18px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
  }
  .hero{
    text-align:left;
    border-bottom:3px solid var(--teal);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  .hero h1{font-size:1.7rem;}
  .hero .sub{color:var(--ink-soft); font-size:.98rem;}
  .meta-row{
    display:flex;
    gap:14px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .meta-chip{
    background:var(--green-soft);
    color:var(--teal-dark);
    border-radius:6px;
    padding:6px 12px;
    font-size:.86rem;
    font-weight:600;
  }
  label{
    display:block;
    font-size:.85rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  input[type=text]{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:1rem;
    margin-bottom:16px;
    background:#fbfdfc;
    color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--teal); border-color:var(--teal);}
  button{
    font-family:inherit;
    font-size:1rem;
    font-weight:600;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
    transition:transform .06s ease, box-shadow .15s ease;
  }
  button:active{transform:scale(0.98);}
  button:focus-visible{outline:2px solid var(--teal-dark); outline-offset:2px;}
  .btn-primary{ background:var(--teal); color:#fff; width:100%;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-primary:disabled{background:#a9beb8; cursor:not-allowed;}
  .btn-secondary{ background:var(--grey-soft); color:var(--teal-dark); border:1.5px solid var(--line);}
  .btn-secondary:hover{background:#e3e9e6;}
  .btn-outline{ background:transparent; color:var(--teal-dark); border:1.5px solid var(--teal);}
  .btn-outline:hover{background:var(--green-soft);}
  .btn-small{ padding:7px 12px; font-size:.85rem;}

  .part-cards{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
  .part-card{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    font-size:.92rem;
    color:var(--ink-soft);
  }
  .part-card b{color:var(--ink);}

  /* Progress bar */
  .progress-bar-outer{
    background:var(--grey-soft);
    border-radius:6px;
    height:10px;
    overflow:hidden;
    margin:10px 0 4px 0;
  }
  .progress-bar-inner{
    background:var(--teal);
    height:100%;
    transition:width .25s ease;
  }
  .progress-label{font-size:.82rem; color:var(--ink-soft); display:flex; justify-content:space-between;}

  /* Question nav grid */
  .qnav{
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    gap:6px;
    margin:14px 0;
  }
  @media(max-width:480px){ .qnav{grid-template-columns:repeat(8,1fr);} }
  .qnav-btn{
    aspect-ratio:1;
    border-radius:6px;
    border:1.5px solid var(--line);
    background:#fbfdfc;
    color:var(--ink-soft);
    font-size:.78rem;
    font-weight:600;
    cursor:pointer;
    padding:0;
  }
  .qnav-btn.answered{ background:var(--green-soft); border-color:var(--teal); color:var(--teal-dark);}
  .qnav-btn.current{ background:var(--teal); border-color:var(--teal); color:#fff;}

  .qcard{
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }
  .qnum{
    font-size:.8rem;
    font-weight:700;
    color:var(--teal);
    letter-spacing:.02em;
    margin-bottom:6px;
  }
  .qtext{
    font-size:1.08rem;
    font-weight:600;
    margin-bottom:16px;
    color:var(--ink);
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:11px 13px;
    margin-bottom:9px;
    cursor:pointer;
    background:#fbfdfc;
  }
  .opt:hover{border-color:var(--teal);}
  .opt.selected{
    border-color:var(--teal);
    background:var(--green-soft);
  }
  .opt input{margin-top:3px;}
  .opt-letter{
    font-weight:700;
    color:var(--teal-dark);
    min-width:18px;
  }
  .qnav-footer{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:16px;
  }
  .qnav-footer button{flex:1;}

  .sticky-bar{
    position:sticky;
    bottom:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:12px 0;
    margin-top:10px;
  }

  /* Results */
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:14px 0;
  }
  .stat-box{
    background:var(--grey-soft);
    border-radius:8px;
    padding:14px;
    text-align:center;
  }
  .stat-box .num{font-size:1.5rem; font-weight:700; color:var(--teal-dark); font-family:Georgia,serif;}
  .stat-box .lbl{font-size:.78rem; color:var(--ink-soft); margin-top:2px;}
  .stat-box.correct .num{color:var(--teal);}
  .stat-box.wrong .num{color:var(--red);}

  .pct-badge{
    display:inline-block;
    background:var(--amber-soft);
    color:#7a5217;
    font-weight:700;
    font-size:1.1rem;
    padding:8px 18px;
    border-radius:30px;
    margin:8px 0 4px 0;
  }

  /* Review */
  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
  .filter-btn{
    background:var(--grey-soft);
    border:1.5px solid var(--line);
    color:var(--ink-soft);
    border-radius:20px;
    padding:6px 14px;
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
  }
  .filter-btn.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .review-item{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:14px;
    margin-bottom:10px;
  }
  .review-item .rq{font-size:.95rem; font-weight:600; margin-bottom:8px;}
  .review-badge{font-size:.8rem; font-weight:700; margin-bottom:8px; display:inline-block;}
  .review-badge.correct{color:var(--teal);}
  .review-badge.wrong{color:var(--red);}
  .review-badge.blank{color:var(--ink-soft);}
  .review-opt{font-size:.88rem; padding:6px 10px; border-radius:6px; margin-bottom:5px;}
  .review-opt.is-correct{background:var(--green-soft); color:var(--teal-dark); font-weight:600;}
  .review-opt.is-wrong{background:var(--red-soft); color:var(--red); font-weight:600;}

  .divider{border:none; border-top:1px solid var(--line); margin:18px 0;}
  .small-note{font-size:.82rem; color:var(--ink-soft);}
  .locked-tag{
    font-size:.75rem;
    background:var(--grey-soft);
    color:var(--ink-soft);
    padding:3px 9px;
    border-radius:20px;
    font-weight:600;
  }
  .part-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,30,26,.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal{
    background:#fff; border-radius:12px; padding:22px; max-width:380px; width:100%;
  }
  .modal h3{margin-bottom:8px;}
  .modal p{color:var(--ink-soft); font-size:.92rem; margin-bottom:18px;}
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{flex:1;}

  .center-text{text-align:center;}
  .loading{text-align:center; padding:60px 20px; color:var(--ink-soft);}
</style>
</head>

// ---------- Supabase ----------
const SUPABASE_URL = 'https://ffhectlvigfdhwcuetee.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_5sxJLvZqy_Q53I0GRuefcQ_Ii1z7m9a';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function pushToSupabase(session){
  try{
    if(!session.supabaseId){
      session.supabaseId = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(16).slice(2)));
    }
    const row = {
      id: session.supabaseId,
      name: session.name,
      district: session.district,
      email: session.email || null,
      answers: session.answers,
      part_results: session.partResults,
      part_submitted: session.partSubmitted,
      total_score: session.finalResult ? session.finalResult.totalScore : null,
      total_percentage: session.finalResult ? session.finalResult.percentage : null,
      total_correct: session.finalResult ? session.finalResult.totalCorrect : null,
      total_wrong: session.finalResult ? session.finalResult.totalWrong : null,
      total_unanswered: session.finalResult ? session.finalResult.totalUnanswered : null,
      started_at: session.startedAt,
      submitted_at: session.submittedAt || null
    };
    const { error } = await sb.from('submissions').upsert(row, { onConflict: 'id' });
    if(error) console.error('Supabase sync failed:', error.message);
  }catch(e){
    console.error('Supabase sync error:', e);
  }
}

function partRange(partIdx){
  const start = partIdx*PART_SIZE;
  return [start, start+PART_SIZE-1];
}

function sanitizeKey(s){
  return s.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'student';
}

function emptySession(name, district, email){
  return {
    name, district, email: email || '',
    answers: {},
    partSubmitted: [false,false,false],
    partResults: [null,null,null],
    startedAt: new Date().toISOString(),
    submittedAt: null
  };
}

function computePartResult(session, partIdx){
  const [start, end] = partRange(partIdx);
  let correct=0, wrong=0, unanswered=0;
  for(let i=start; i<=end; i++){
    const qNo = i+1;
    const given = session.answers[qNo];
    if(given === undefined || given === null){ unanswered++; }
    else if(given === QUESTIONS[i].a){ correct++; }
    else { wrong++; }
  }
  const total = end-start+1;
  return {
    correct, wrong, unanswered, total,
    score: correct,
    percentage: Math.round((correct/total)*1000)/10
  };
}

function computeFinal(session){
  let totalScore=0, totalCorrect=0, totalWrong=0, totalUnanswered=0;
  session.partResults.forEach(r=>{
    if(r){ totalScore += r.score; totalCorrect += r.correct; totalWrong += r.wrong; totalUnanswered += r.unanswered; }
  });
  return {
    totalScore, totalCorrect, totalWrong, totalUnanswered,
    percentage: Math.round((totalScore/TOTAL_Q)*1000)/10
  };
}

// ---------- storage ----------
async function saveSession(session){
  const key = 'mcqtest:' + sanitizeKey(session.name) + '|' + sanitizeKey(session.district);
  try{
    await window.storage.set(key, JSON.stringify(session), false);
  }catch(e){ console.error('save failed', e); }
}
async function loadSession(name, district){
  const key = 'mcqtest:' + sanitizeKey(name) + '|' + sanitizeKey(district);
  try{
    const res = await window.storage.get(key, false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){ /* not found */ }
  return null;
}

let state = {
  screen: 'entry', // entry | test | partResult | finalResult
  session: null,
  activePart: 0,
  currentQ: 0, // index within part, 0-49
  reviewFilter: 'all',
  reviewPart: 0,
  confirmSubmit: false,
  saving: false
};

const app = document.getElementById('app');

function render(){
  if(state.screen === 'loading'){ app.innerHTML = `<div class="loading">Loading your test…</div>`; return; }
  if(state.screen === 'entry') return renderEntry();
  if(state.screen === 'test') return renderTest();
  if(state.screen === 'partResult') return renderPartResult();
  if(state.screen === 'finalResult') return renderFinalResult();
  if(state.screen === 'reviewAll') return renderReviewAll();
}

function renderEntry(){
  app.innerHTML = `

      <h1>Biology — Chromosomes and DNA</h1>
      <div class="sub">Class 12 Biology · MCQ Practice Test</div>
      <div class="meta-row">

    </div>
  `;
  document.getElementById('startBtn').onclick = onStart;
  document.getElementById('fname').addEventListener('input', e=> state.draftName = e.target.value);
  document.getElementById('fdist').addEventListener('input', e=> state.draftDistrict = e.target.value);
  document.getElementById('femail').addEventListener('input', e=> state.draftEmail = e.target.value);
}

async function onStart(){
  const name = document.getElementById('fname').value.trim();
  const district = document.getElementById('fdist').value.trim();
  const email = document.getElementById('femail').value.trim();
  if(!name || !district){
    alert('Please enter both your full name and district to begin.');
    return;
  }
  state.screen = 'loading'; render();
  let session = await loadSession(name, district);
  if(!session){
    session = emptySession(name, district, email);
    await saveSession(session);
  } else if(email && !session.email){
    session.email = email;
    await saveSession(session);
  }
  pushToSupabase(session); // fire-and-forget: ensure the row exists remotely for the dashboard
  state.session = session;
  if(session.submittedAt){
    state.screen = 'finalResult';
  } else {
    const nextPart = session.partSubmitted.findIndex(s=>!s);
    state.activePart = nextPart === -1 ? TOTAL_PARTS-1 : nextPart;
    if(session.partSubmitted[state.activePart]){
      // all submitted edge case
      state.screen = 'finalResult';
    } else {
      state.currentQ = 0;
      state.screen = 'test';
    }
  }
  render();
}

// ---------- TEST ----------
function partAnsweredCount(session, partIdx){
  const [start,end] = partRange(partIdx);
  let c=0;
  for(let i=start;i<=end;i++){ if(session.answers[i+1]!==undefined) c++; }
  return c;
}

function renderTest(){
  const session = state.session;
  const partIdx = state.activePart;
  const [start,end] = partRange(partIdx);
  const qIndex = start + state.currentQ; // 0-based overall index
  const q = QUESTIONS[qIndex];
  const qNo = qIndex+1;
  const answeredCount = partAnsweredCount(session, partIdx);
  const totalInPart = end-start+1;
  const given = session.answers[qNo];

  const nav = [];
  for(let i=0;i<totalInPart;i++){
    const thisQNo = start+i+1;
    const cls = ['qnav-btn'];
    if(session.answers[thisQNo]!==undefined) cls.push('answered');
    if(i===state.currentQ) cls.push('current');
    nav.push(`<button class="${cls.join(' ')}" data-nav="${i}">${i+1}</button>`);
  }

  app.innerHTML = `
    <div class="panel">
      <div class="part-header">
        <h2 style="margin:0;">Part ${partIdx+1} <span style="color:var(--ink-soft); font-weight:400; font-size:.9rem;">(Q ${start+1}–${end+1})</span></h2>
        <span class="locked-tag">${session.name}</span>
      </div>
      <div class="progress-label"><span>Part ${partIdx+1}: ${answeredCount}/${totalInPart} answered</span><span>${Math.round(answeredCount/totalInPart*100)}%</span></div>
      <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${answeredCount/totalInPart*100}%"></div></div>
      <div class="qnav">${nav.join('')}</div>
    </div>

    <div class="panel qcard">
      <div class="qnum">QUESTION ${qNo} OF ${TOTAL_Q}</div>
      <div class="qtext">${q.q}</div>
      <div id="opts">
        ${q.o.map((opt,i)=>`
          <div class="opt ${given===i?'selected':''}" data-opt="${i}">
            <span class="opt-letter">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
      <div class="qnav-footer">
        <button class="btn-secondary" id="prevBtn" ${state.currentQ===0?'disabled':''}>← Previous</button>
        <button class="btn-secondary" id="nextBtn" ${state.currentQ===totalInPart-1?'disabled':''}>Next →</button>
      </div>
    </div>

    <div class="sticky-bar">
      <button class="btn-primary" id="submitPartBtn">Submit Part ${partIdx+1}</button>
    </div>

    ${state.confirmSubmit ? renderConfirmModal(partIdx, answeredCount, totalInPart) : ''}
  `;

  document.querySelectorAll('.qnav-btn').forEach(btn=>{
    btn.onclick = ()=>{ state.currentQ = parseInt(btn.dataset.nav); render(); };
  });
  document.querySelectorAll('.opt').forEach(el=>{
    el.onclick = async ()=>{
      const i = parseInt(el.dataset.opt);
      session.answers[qNo] = i;
      render();
      await saveSession(session);
    };
  });
  const prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.onclick = ()=>{ if(state.currentQ>0){ state.currentQ--; render(); } };
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = ()=>{ if(state.currentQ<totalInPart-1){ state.currentQ++; render(); } };
  document.getElementById('submitPartBtn').onclick = ()=>{ state.confirmSubmit = true; render(); };

  if(state.confirmSubmit){
    document.getElementById('cancelSubmit').onclick = ()=>{ state.confirmSubmit=false; render(); };
    document.getElementById('confirmSubmitBtn').onclick = async ()=>{ await doSubmitPart(partIdx); };
  }
}

function renderConfirmModal(partIdx, answered, total){
  const unanswered = total-answered;
  return `
    <div class="modal-backdrop">
      <div class="modal">
        <h3>Submit Part ${partIdx+1}?</h3>
        <p>You have answered ${answered} of ${total} questions in this part${unanswered>0?` — ${unanswered} question(s) will be left unanswered`:''}. Once submitted, you cannot change your answers for this part.</p>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelSubmit">Cancel</button>
          <button class="btn-primary" id="confirmSubmitBtn">Submit</button>
        </div>
      </div>
    </div>
  `;
}

async function doSubmitPart(partIdx){
  const session = state.session;
  if(session.partSubmitted[partIdx]) return; // prevent duplicate
  const result = computePartResult(session, partIdx);
  session.partSubmitted[partIdx] = true;
  session.partResults[partIdx] = result;
  if(partIdx === TOTAL_PARTS-1){
    session.submittedAt = new Date().toISOString();
    session.finalResult = computeFinal(session);
  }
  await saveSession(session);
  await pushToSupabase(session); // save this part's (and, on part 3, the final) result to Supabase
  state.confirmSubmit = false;
  state.screen = 'partResult';
  render();
}

function renderReviewAll(){
  const session = state.session;
  const single = state.reviewSinglePart;
  const parts = single ? [state.reviewPart] : [0,1,2].filter(p=>session.partSubmitted[p]);

  const filters = [
    {id:'all', label:'All Questions'},
    {id:'correct', label:'Correct Answers'},
    {id:'wrong', label:'Wrong Answers'},
    {id:'unanswered', label:'Unanswered'}
  ];

  let itemsHtml = '';
  parts.forEach(partIdx=>{
    const [start,end] = partRange(partIdx);
    let partItems = '';
    for(let i=start;i<=end;i++){
      const qNo = i+1;
      const q = QUESTIONS[i];
      const given = session.answers[qNo];
      let status = 'blank';
      if(given!==undefined){ status = given===q.a ? 'correct' : 'wrong'; }
      if(state.reviewFilter!=='all' && state.reviewFilter!==status) continue;
      const badge = status==='correct' ? '<span class="review-badge correct">✅ Correct</span>' :
                    status==='wrong' ? '<span class="review-badge wrong">❌ Wrong</span>' :
                    '<span class="review-badge blank">⚪ Unanswered</span>';
      partItems += `
        <div class="review-item">
          <div class="qnum">QUESTION ${qNo}</div>
          <div class="rq">${q.q}</div>
          ${badge}
          <div>
            ${q.o.map((opt,oi)=>{
              let cls='review-opt';
              if(oi===q.a) cls+=' is-correct';
              else if(oi===given) cls+=' is-wrong';
              let tag='';
              if(oi===q.a) tag=' (Correct answer)';
              else if(oi===given) tag=' (Your answer)';
              return `<div class="${cls}">${String.fromCharCode(65+oi)}. ${opt}${tag}</div>`;
            }).join('')}
          </div>
        </div>
      `;
    }
    if(!single){
      itemsHtml += `<h3 style="margin-top:20px;">Part ${partIdx+1}: Questions ${start+1}–${end+1}</h3>`;
    }
    itemsHtml += partItems || `<div class="small-note">No questions match this filter in this part.</div>`;
  });

  app.innerHTML = `
    <div class="hero">
      <h1>${single ? 'Review — Part '+(state.reviewPart+1) : 'Review All Answers'}</h1>
      <div class="sub">${session.name} · ${session.district}</div>
    </div>
    <div class="filter-row">
      ${filters.map(f=>`<button class="filter-btn ${state.reviewFilter===f.id?'active':''}" data-f="${f.id}">${f.label}</button>`).join('')}
    </div>
    ${itemsHtml}
    <button class="btn-secondary" id="backBtn" style="margin-top:16px;">← Back</button>
  `;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.onclick = ()=>{ state.reviewFilter = b.dataset.f; render(); };
  });
  document.getElementById('backBtn').onclick = ()=>{
    state.screen = single ? 'partResult' : 'finalResult';
    render();
  };
}

render();
</script>
</body>
</html>
